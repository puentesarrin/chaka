name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        database: [sqlite, mysql, postgres]
        include:
          - database: sqlite
            extras: dev
            url: ''
          - database: mysql
            extras: dev,mysql
            url: mysql+aiomysql://root:chaka@127.0.0.1:3306/chaka
          - database: postgres
            extras: dev,postgres
            url: postgresql+asyncpg://postgres:chaka@127.0.0.1:5432/chaka
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: chaka
          MYSQL_DATABASE: chaka
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchaka"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: chaka
          POSTGRES_DB: chaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Empty for the SQLite legs: the migration tests then use a throwaway file.
      TEST_DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[${{ matrix.extras }}]"
      - name: Test
        run: pytest --cov=chaka --cov-report=term-missing
